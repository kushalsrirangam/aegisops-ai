name: Backend CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: python -m compileall -q app
      - run: pytest -q
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegisops
          POSTGRES_PASSWORD: aegisops
          POSTGRES_DB: aegisops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisops -d aegisops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_MODE: demo
      DATABASE_URL: postgresql+psycopg://aegisops:aegisops@localhost:5432/aegisops_test
      INTEGRATION_DATABASE_URL: postgresql+psycopg://aegisops:aegisops@localhost:5432/aegisops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: pytest -q tests/integration
